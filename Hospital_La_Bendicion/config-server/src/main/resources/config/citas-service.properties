server.port=8097
 
spring.application.name=citas-service
# PostgreSQL - base de datos propia del microservicio
spring.datasource.url=jdbc:postgresql://localhost:5432/db_pacientes
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
 
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
 
# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
 
# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
 
logging.levels.root: INFO
logging.levels.root.com.umg.microservicios: WARN
logging.pattern.console: '%d{yyyy-MM-dd HH:mm:ss} {%thread} %-5level %logger{36} - %msg%n'
logging.pattern.file: '%d{yyyy-MM-dd HH:mm:ss} {%thread} %-5level %logger{36} - %msg%n'
logging.file.name: logs/citas-service.log
logging.file.max-size: 10MB
logging.file.max-history: 30

 