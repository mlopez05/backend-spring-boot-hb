server.port=${PORT:8095}

# Conexión dinámica a la base de datos db_auth en Railway
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/db_historial
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Mantener en update para no borrar tus tablas de la nube
spring.jpa.hibernate.ddl-auto=update

# Conexión al Eureka Server (Discovery Server)
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

logging.levels.root: INFO
logging.levels.root.com.umg.microservicios: WARN
logging.pattern.console: '%d{yyyy-MM-dd HH:mm:ss} {%thread} %-5level %logger{36} - %msg%n'
logging.pattern.file: '%d{yyyy-MM-dd HH:mm:ss} {%thread} %-5level %logger{36} - %msg%n'
logging.file.name: logs/historial-service.log
logging.file.max-size: 10MB
logging.file.max-history: 30